media:
  input: media
  output: /media
  rename: safe
content:
  - name: servicios
    label: Servicios y precios
    type: file
    path: servicios.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Servicio
        type: string
        required: true
      - name: precio
        label: Precio en euros
        type: number
        required: true
  - name: contenido
    label: Textos y enlaces
    type: file
    path: contenido.json
    format: json
    fields:
      - name: etiqueta_principal
        label: Etiqueta superior
        type: string
      - name: titulo_principal
        label: Título de la portada
        type: string
      - name: subtitulo_principal
        label: Texto de la portada
        type: text
      - name: titulo_servicios
        label: Título de servicios
        type: string
      - name: texto_servicios
        label: Explicación de servicios
        type: text
      - name: titulo_galeria
        label: Título de fotos
        type: string
      - name: texto_galeria
        label: Explicación de fotos
        type: text
      - name: anuncio
        label: Aviso o promoción
        type: text
        description: Déjalo vacío para no mostrar ningún anuncio
      - name: horarios
        label: Horarios (texto)
        type: text
      - name: booksy
        label: Enlace de reservas Booksy
        type: string
      - name: instagram
        label: Enlace de Instagram
        type: string
  - name: fotografias
    label: Fotos de la galería
    type: file
    path: fotografias.json
    format: json
    list: true
    fields:
      - name: imagen
        label: Fotografía
        type: image
        required: true
      - name: descripcion
        label: Descripción de la fotografía
        type: string
      - name: pie
        label: Texto debajo de la fotografía
        type: string
  - name: apariencia
    label: Diseño y configuración
    type: file
    path: apariencia.json
    format: json
    fields:
      - name: color_fondo
        label: Color de fondo (ej. #090909)
        type: string
      - name: color_panel
        label: Color de tarjetas
        type: string
      - name: color_texto
        label: Color del texto
        type: string
      - name: color_dorado
        label: Color principal de acento
        type: string
      - name: color_dorado_claro
        label: Color claro del acento
        type: string
      - name: logotipo
        label: Logotipo
        type: image
      - name: foto_portada
        label: Imagen grande de portada
        type: image
      - name: texto_boton_reserva
        label: Texto botones de reservas
        type: string
      - name: texto_boton_galeria
        label: Texto botón de galería
        type: string
      - name: texto_boton_mapa
        label: Texto botón del mapa
        type: string
      - name: titulo_seo
        label: Título para buscadores
        type: string
      - name: descripcion_seo
        label: Descripción para buscadores
        type: text
      - name: mostrar_identidad
        label: Mostrar sección Presentación
        type: boolean
      - name: orden_identidad
        label: Orden sección Presentación (1-4)
        type: number
      - name: mostrar_servicios
        label: Mostrar sección Servicios
        type: boolean
      - name: orden_servicios
        label: Orden sección Servicios (1-4)
        type: number
      - name: mostrar_galeria
        label: Mostrar sección Galería
        type: boolean
      - name: orden_galeria
        label: Orden sección Galería (1-4)
        type: number
      - name: mostrar_contacto
        label: Mostrar sección Contacto
        type: boolean
      - name: orden_contacto
        label: Orden sección Contacto (1-4)
        type: number
